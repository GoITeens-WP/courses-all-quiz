{% set section = footer %}
<footer class="bg-[#1A1A1A] pb-[64px] pt-8 font-gotham text-white md:pb-10 md:pt-10">
  <div class="container md:px-[32px] xl:flex xl:justify-between">
    <div
      class="footer__content-wrapper relative pb-8 md:flex md:justify-between md:pb-[44px] xl:gap-[207px] xl:pb-0 xxl:gap-[251px]"
    >
      <div class="flex-col items-center md:items-start smOnly:flex smOnly:justify-between">
        <div class="md:mb-[27px]">
          <a
            href="{{page.canonical}}"
            aria-label="{{components.logo.link_logo_aria}}"
            class="mb-[49px] block md:mb-[28px]"
          >
            <svg
              width="118"
              height="30"
              aria-label="{{components.logo.logo_aria}}"
              class="md:h-[43px] md:w-[169px]"
            >
              <use href="./assets/images/sprite.svg#logo"></use>
            </svg>
          </a>
        </div>
        <ul class="flex max-h-[96px] flex-wrap gap-4 sm:max-w-full sm:flex-nowrap">
          {% for item in section.socialItems %}
          <li class="h-[40px] w-[40px]">
            <a
              href="{{item.link}}"
              rel="noopener noreferrer nofollow"
              aria-label="{{item.ariaLabel}}"
              target="_blank"
              class="footer-social-link"
            >
              <svg
                width="40"
                height="40"
                aria-label="{{item.svgAlt}}"
                class="footer__icon-social fill-white hover:fill-[#fec830]"
              >
                <use href="./assets/images/sprite.svg#{{item.svg}}"></use>
              </svg>
            </a>
          </li>
          {% endfor %}
        </ul>
      </div>
    </div>
    <div
      class="pt-8 md:flex md:items-center md:justify-between xl:flex-col xl:items-end xl:justify-start xl:gap-5 xl:pt-0"
    >
      <a
        href="tel:{{section.contactNumberLink}}"
        class="mb-7 block text-[20px] leading-[0.9] hover:text-[#fec830] focus:text-[#fec830] smOnly:text-center"
      >
        <svg
          width="24"
          height="24"
          class="inline-block fill-white hover:fill-[#fec830] focus:fill-[#fec830]"
          aria-label="іконка телефона"
        >
          <use href="./assets/images/sprite.svg#phone"></use>
        </svg>
        {{section.contactNumber}}</a
      >
      <ul class="mx-auto mb-7 flex max-w-[92px] gap-4 md:m-0">
        {% for item in section.paymentList %}
        <li>
          <svg width="38" height="26" aria-label="{{item.svgAlt}}">
            <use href="./assets/images/sprite.svg#{{item.svg}}"></use>
          </svg>
        </li>
        {% endfor %}
      </ul>
      <ul
        class="mx-auto flex max-w-[221px] flex-col items-center gap-[10px] text-[16px] leading-[0.95] text-white md:m-0 md:items-end"
      >
        {% for item in section.documentList %}
        <li class="flex items-center">
          <a
            href="{{item.link}}"
            target="_blank"
            rel="noopener noreferrer nofollow"
            class="underline duration-300 hover:text-accent focus:text-accent"
            >{{item.title}}
          </a>
        </li>
        {% endfor %}
      </ul>
    </div>
  </div>
</footer>

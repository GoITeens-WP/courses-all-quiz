{% set section = header %}
<header class="{{section.id}} mb-10">
  <div class="container">
    <div class="mb-4 flex items-center justify-between pt-5 relative">
      <!-- LOGO -->
      <a href="{{page.canonical}}" aria-label="{{logo.link_logo_aria}}">
        <svg width="80" height="24" aria-label="{{logo.logo_aria}}">
          <title>{{logo.logo_aria}}</title>
          <use href="./assets/images/sprite.svg#logo"></use>
        </svg>
      </a>
    </div>
    <p class="banner h-[89px] w-[89px] text-center text-[8px] font-bold leading-[12px] text-white pt-[30px] absolute top-[100px] right-[20px]">
      {{section.only}}
    </p>
    <p class="mb-5 text-sm font-semibold">{{section.text}}</p>
    <h1 class="mb-[64px] text-[32px] font-bold leading-[1]">{{section.title}}</h1>
    <div class="gift relative mb-6 overflow-hidden rounded-[16px] px-3 py-6 shadow-blue">
      <p class="mb-4 text-xl font-bold">{{section.how}}</p>
      <p class="img-people relative mb-[146px] text-base font-medium">{{section.help}}</p>

      <div class="mb-3 flex">
        <p class="mr-[70px]">{{section.cost.title}}</p>
        <p class="font-bold line-through">{{section.cost.value}}</p>
      </div>
      <div class="flex">
        <p class="mr-[65px]">{{section.for.title}}</p>
        <p class="font-bold">{{section.for.value}}</p>
      </div>
    </div>
    <!-- TIMER -->
    <div class="mb-4">{% include 'components/timer.html' %}</div>
    <!-- END TIMER -->
    <button class="btn-accent" data-modal-open>{{btnMain}}</button>
  </div>
</header>

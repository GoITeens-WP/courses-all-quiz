{% set section = about %}
<section class="{{section.id}} py-10 md:py-20 xl:py-[172px]">
  <div class="container">
    <!-- TITLE & DESCRIPTION -->
    <h2 class="mb-6 font-IBMPlexMono text-black-1A text-[20px] font-semibold uppercase leading-[26px] md:text-[32px] md:leading-[42px] md:mb-10 xl:mb-6 xxl:mb-10">
      {{section.title}}
    </h2>
    <p class="mb-6 text-base text-black-47 font-normal md:mb-8 md:text-xl xl:mb-[48px] xl:max-w-[984px]">
      {{section.text}}
    </p>

    <!-- ACHIEVEMENTS LIST -->
    <ul
      class="flex smOnly:flex-col smOnly:gap-6 md:flex-wrap md:items-center md:justify-between md:gap-y-[96px]"
    >
      <!-- IMG AWARD ITEM -->
      {% for item in section.items %} {% if item.img %}
      <li class="about__items {{item.class}} relative md:px-[35px] md:pt-12 xl:px-0 xxl:pb-5">
          <img
            class="item-img mx-auto mb-2 xxl:mb-6"
            width="{{item.width}}"
            height="{{item.height}}"
            loading="lazy"
            alt="{{item.alt}}"
            src="./assets/images/sections/about/{{item.img}}.webp"
            srcset="./assets/images/sections/about/{{item.img}}@2x.webp 2x"
          />
        <h3
          class="item-title mb-2 text-center font-IBMPlexMono text-[#213075] text-[16px] leading-[26px] font-semibold md:leading-[1.3] xl:text-[24px] xl:leading-[31px]"
        >
          {{item.title}}
        </h3>
        <p class="text-center text-xs text-[#27398A] font-semibold leading-[18px] md:text-[10px] md:leading-[14px] xl:text-base">
          {{item.text}}
        </p>
      </li>

      <!-- NUMBERED ACHIEVEMENT ITEM -->
      {% else %}
      <li class="about__items {{item.class}} relative">
        <p
          class="item-number mb-2 text-center font-IBMPlexMono text-[68px] font-semibold uppercase leading-[1.2] md:text-[60px] xl:text-[100px] mdOnly:mb-1"
        >
          {{item.number}}
        </p>
        <p
          class="item-text text-center font-IBMPlexMono text-base font-semibold xl:text-2xl mdOnly:text-[16px]"
        >
          {{item.text}}
        </p>
      </li>
      {% endif %}
      {% endfor %}
    </ul>
  </div>
</section>

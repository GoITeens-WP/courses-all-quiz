{% set section = about %}

<section class="{{section.id}} py-10 xl:py-20">
  <div class="container">
    <h2 class="section-title">{{section.title}}</h2>

    <p
      class="mt-6 text-sm md:mt-8 md:text-[16px] md:leading-normal xl:max-w-[984px] xxl:text-[18px]"
    >
      {{section.text}}
    </p>

    <ul
      class="list mt-6 grid grid-cols-1 gap-6 md:mt-12 md:grid-cols-3 md:gap-x-7 md:gap-y-10 xl:gap-x-0 xl:gap-y-24 xxl:mx-auto xxl:max-w-[1376px] xxl:gap-x-[88px]"
    >
      {% for item in section.items %} {% if item.img %}

      <li class="item {{item.class}}">
        <img
          class="image mx-auto block h-auto w-[88px] md:w-[65px] xl:w-[120px] xxl:w-[124px]"
          width="{{item.width}}"
          height="{{item.height}}"
          loading="lazy"
          alt="{{item.alt}}"
          src="./assets/images/sections/about/{{item.img}}.webp"
          srcset="./assets/images/sections/about/{{item.img}}@2x.webp 2x"
        />
        <h3
          class="title mx-auto mt-2 max-w-[220px] text-center font-IBMPlexMono font-semibold uppercase md:max-w-[200px] md:text-[14px] md:leading-normal xl:max-w-none xl:text-[20px] xl:leading-[1.3]"
        >
          {{item.title}}
        </h3>
        <p
          class="text mx-auto mt-2 max-w-[260px] text-center font-IBMPlexSans text-[12px] font-semibold leading-[1.5] md:text-[10px] md:leading-snug xl:mt-1 xl:max-w-[305px] xl:text-[16px] xl:leading-[1.5]"
        >
          {{item.text}}
        </p>
      </li>

      {% else %}

      <li class="item {{item.class}}">
        <span
          class="numbers block text-center font-IBMPlexMono text-[68px] font-semibold leading-[1.3] md:text-[50px] xl:text-[92px]"
          >{{item.number}}</span
        >
        <p
          class="text mt-2 text-center font-IBMPlexMono text-lg font-semibold uppercase md:text-[14px] md:leading-[1.28] xl:text-[20px] xl:leading-[1.6]"
        >
          {{item.text}}
        </p>
      </li>

      {% endif %} {% endfor %}
    </ul>
  </div>
</section>

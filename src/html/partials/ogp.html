{% set page = pages %}

<!-- OG markup -->
<meta name="description" content="{{ page.description }}" />
<meta property="og:type" content="website" />
<meta property="og:url" content="{{ page.canonical }}" />
<meta property="og:image" content="{{ page.og_image }}" />
<meta property="og:image:type" content="{{ page.og_image_type }}" />
<meta property="og:image:width" content="{{ page.og_image_width }}" />
<meta property="og:image:height" content="{{ page.og_image_height }}" />
<meta property="og:title" content="{{ page.og_title }}" />
<meta property="og:description" content="{{ page.og_description }}" />
<!-- OG markup for twitter Summary Card with Large Image -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:site" content="{{ page.og_site_name }}" />
<meta name="twitter:title" content="{{ page.og_title }}" />
<meta name="twitter:description" content="{{ page.og_description }}" />
<meta name="twitter:image:src" content="{{ page.tw_image }}" />
<!-- OG markup  end -->

<ul>
  {% for item in accordion.items %}
  <li
    class="cursor-pointer overflow-hidden border border-black"
    id="accordion-item"
    aria-expanded="false"
  >
    <button class="pointer-events-none relative block w-full" id="accordion-btn" type="button">
      <span class="block">{{item.question}}</span>
      <svg id="accordion-svg" aria-label="{{accordion.svgAria}}" width="18" height="8">
        <use href="./assets/images/sprite.svg#accordion-arrow"></use>
      </svg>
    </button>
    <p class="cursor-auto" id="accordion-answer">{{item.answer}}</p>
  </li>
  {% endfor %}
</ul>

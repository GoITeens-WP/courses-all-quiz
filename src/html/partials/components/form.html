<form class="mt-6 text-lg" id="{{form.ID}}" novalidate autocomplete="on">
  <div class="flex flex-wrap gap-6">{% block formFields %} {% endblock %}</div>
  <button
    class="form-btn disabled:border-none disabled:bg-gray-200 disabled:hover:text-white"
    type="submit"
  >
    {{ form.btnSubmit }}
  </button>
</form>

<form class="" id="{{formId}}" novalidate autocomplete="on">
  <div class="flex flex-wrap gap-6">
    {% block formFields %} {% endblock %}
    <button
      class="btn-submit disabled:border-none disabled:bg-gray-200 disabled:hover:text-white"
      type="submit"
    >
      {{ form.btnSubmit }}
    </button>
  </div>
</form>
